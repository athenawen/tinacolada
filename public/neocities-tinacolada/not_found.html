<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>tinacolada</title>
  <link rel="icon" href="/pinacolada.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    body {
      background: url("/404/bg.png") no-repeat center/cover;
      background-size: 100vw auto;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .sheree {
      position: absolute;
      top: 27vh;
      left: 5vw;
    }
    .sheree img {
      width: 10vw;
      height: auto;
      display: block;
    }
    .bunny {
      position: absolute;
      top: 27vh;
      left: 35vw;
    }
    .bunny img {
      width: 11vw;
      height: auto;
      display: block;
    }
    .worrybear {
      position: absolute;
      top: 25vh;
      right: 30vw;
    }
    .worrybear img {
      width: 10vh;
      height: auto;
      display: block;
    }
    .clancy {
      position: absolute;
      top: 22vh;
      right: 8vw;
    }
    .clancy img {
      width: 16vh;
      height: auto;
      display: block;
    }
    .bob {
      position: absolute;
      top: 36vh;
      left: 15vw;
    }
    .bob img {
      width: 18vh;
      height: auto;
      display: block;
    }
    .mika {
      position: absolute;
      top: 56vh;
      left: 58vw;
      z-index: 100;

    }
    .mika img {
      width: 35vh;
      height: auto;
      display: block;
    }
    .paul {
      position: absolute;
      top: 40vh;
      left: 58vw;
      animation: paulMove 10s linear infinite;
    }
    .paul img {
      width: 40vh;
      height: auto;
      display: block;
      transform-origin: center center;
      animation: paulSpin 3s linear infinite;
    }

    @keyframes paulSpin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes paulMove {
      0% {
        transform: translateX(-140vw);
      }
      100% {
        transform: translateX(60vw);
      }
    }
 
    .return-button {
      position: absolute;
      top: 85vh;
      left: 5vw;
      font-family: courier, sans-serif;
      font-size: 5rem;
      color: white;
      background: transparent;
      padding: 8px 12px;
      cursor: pointer;
      text-shadow: 1px 1px 2px rgba(123, 123, 123, 0.7);
      transition: all 0.2s;
      z-index: 1000; 
      border: none;
      outline: none;
      box-shadow: none;
      appearance: none;
      -webkit-appearance: none;
      text-decoration: underline;
    }
    
    .return-button:hover {
      text-decoration: underline dotted; 
    }
    .container img {
      cursor: pointer;
      transition: opacity 0.2s ease-in-out;
      border: none;
      background: none;
    }
    .container img:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
<button class="return-button" onclick="goBack()">
  return
</button>

<script>
  function goBack() {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "/index.html";
    }
  }
  
</script>
  <div class="container">
    <div class="sheree">
        <img src="/404/sheree.png" alt="sheree">
    </div>
    <div class="bunny">
        <img src="/404/bunny.png" alt="bunny">
    </div>
    <div class="clancy">
        <img src="/404/clancy.png" alt="clancy">
    </div>
    <div class="worrybear">
        <img src="/404/worrybear.png" alt="worrybear">
    </div>
    <div class="bob">
        <img src="/404/bob.png" alt="bob">
    </div>
    <div class="mika">
        <img src="/404/mika.png" alt="mika">
    </div>
    <div class="paul">
        <img src="/404/paul.png" alt="paul">
    </div>
  </div>
</body>
</html>
